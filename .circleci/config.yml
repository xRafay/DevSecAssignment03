version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/repo

  docker-executor:
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo

jobs:
  unit-tests:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest
      - run:
          name: Run Unit Tests
          command: pytest test_app.py
      - store_artifacts:
          path: test-results/
          destination: unit-test-results

  sonar-scan:
    docker:
      - image: sonarsource/sonar-scanner-cli
    steps:
      - checkout
      - run:
          name: Run SonarQube Scan
          command: |
            sonar-scanner \
              -Dsonar.projectKey=DevSecAssignment02 \
              -Dsonar.sources=. \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN

  dependency-check:
    executor: docker-executor
    steps:
      - checkout
      - run:
          name: Run OWASP Dependency-Check
          command: |
            mkdir -p reports
            docker run --rm \
              -v "$(pwd):/src" \
              owasp/dependency-check \
              --project "DevSecAssignment02" \
              --scan /src \
              --format "HTML" \
              --out /src/reports
      - store_artifacts:
          path: reports
          destination: depcheck-report

  build-and-push:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: |
            docker build -t $DOCKERHUB_USERNAME/devsec02:latest .
      - run:
          name: Push to Docker Hub
          command: |
            echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
            docker push $DOCKERHUB_USERNAME/devsec02:latest

workflows:
  version: 2
  devsecops-pipeline:
    jobs:
      - unit-tests
      - sonar-scan
      - dependency-check
      - build-and-push:
          requires:
            - unit-tests
            - sonar-scan
            - dependency-check
